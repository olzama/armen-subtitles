# GPT-6 Sol main design: 3 translations x 4 eval runs per method.
# GPT-6 Sol accepts only the default temperature (1); the value below is not applied.
film: ivan-vas
source_lang: Russian
target_lang: Galician
trans_model: gpt-6-sol
eval_model: gpt-5.4-mini
temperature: 0.8
eval_runs: 4
eval_prompt: experiments/films/prompts/eval/mqm-memes.txt
variance_delta: 0.06
methods:
- name: zero-lang
  n_runs: 3
  lang_prompt: true
- name: characters-lang
  n_runs: 3
  prompt: experiments/films/prompts/characters.txt
  summary: experiments/films/data/ivan-vas/summaries/characters.txt
  lang_prompt: true
- name: list-lang
  n_runs: 3
  prompt: experiments/films/prompts/unit-list.txt
  unit_list: experiments/films/data/ivan-vas/meme-list.json
  lang_prompt: true
- name: list-analysis-lang
  n_runs: 3
  prompt: experiments/films/prompts/list-analysis.txt
  unit_list: experiments/films/data/ivan-vas/list-analysis-all.json
  lang_prompt: true
- name: given-lang
  n_runs: 3
  prompt: experiments/films/prompts/given-translations.txt
  given_trans: experiments/films/data/ivan-vas/reference.json
  lang_prompt: true
- name: meme-search
  n_runs: 3
  search_model: gpt-6-sol
