# Opus 5.5 (subscription, claude -p): three translations per condition; temperature not applied.
film: diamond-arm
source_lang: Russian
target_lang: English
trans_model: claude-opus-5-5
eval_model: gpt-5-mini
temperature: 0.8
eval_runs: 4
eval_prompt: experiments/films/prompts/eval/mqm-memes.txt
variance_delta: 0.03
methods:
- name: zero
  n_runs: 3
- name: characters
  n_runs: 3
  prompt: experiments/films/prompts/characters.txt
  summary: experiments/films/data/diamond-arm/summaries/characters.txt
- name: list
  n_runs: 3
  prompt: experiments/films/prompts/unit-list.txt
  unit_list: experiments/films/data/diamond-arm/meme-list.json
- name: list-analysis
  n_runs: 3
  prompt: experiments/films/prompts/list-analysis.txt
  unit_list: experiments/films/data/diamond-arm/list-analysis-general-all.json
- name: given
  n_runs: 3
  prompt: experiments/films/prompts/given-translations.txt
  given_trans: experiments/films/data/diamond-arm/reference.json
- name: meme-search
  n_runs: 3
  search_model: claude-opus-5-5
