# GPT-5.2 re-scoring after span re-mapping (extract_meme_spans.py): 4 eval runs per translation.
film: ivan-vas
source_lang: Russian
target_lang: English
trans_model: gpt-5.2
eval_model: gpt-5-mini
temperature: 0.8
eval_runs: 4
eval_prompt: experiments/films/prompts/eval/mqm-memes.txt
variance_delta: 0.1
methods:
- name: zero
  n_runs: 18
- name: summary
  n_runs: 4
  prompt: experiments/films/prompts/summary.txt
  summary: experiments/films/data/ivan-vas/summaries/summary.txt
- name: characters
  n_runs: 4
  prompt: experiments/films/prompts/characters.txt
  summary: experiments/films/data/ivan-vas/summaries/characters.txt
- name: narratives
  n_runs: 4
  prompt: experiments/films/prompts/narratives.txt
  summary: experiments/films/data/ivan-vas/summaries/narratives.txt
- name: intertext
  n_runs: 4
  prompt: experiments/films/prompts/intertext.txt
  summary: experiments/films/data/ivan-vas/summaries/intertext.txt
- name: examples
  n_runs: 5
  prompt: experiments/films/prompts/examples.txt
  summary: experiments/films/data/ivan-vas/summaries/examples.txt
- name: list
  n_runs: 6
  prompt: experiments/films/prompts/unit-list.txt
  unit_list: experiments/films/data/ivan-vas/meme-list.json
- name: list-analysis
  n_runs: 14
  prompt: experiments/films/prompts/list-analysis.txt
  unit_list: experiments/films/data/ivan-vas/list-analysis-general-all.json
- name: given
  n_runs: 4
  prompt: experiments/films/prompts/given-translations.txt
  given_trans: experiments/films/data/ivan-vas/reference.json
- name: noise
  n_runs: 2
  prompt: experiments/films/prompts/characters.txt
  summary: experiments/films/data/diamond-arm/summaries/characters.txt
- name: meme-search
  n_runs: 3
  search_model: gpt-5.2
