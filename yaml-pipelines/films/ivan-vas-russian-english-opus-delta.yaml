# Opus 5.5, extra translations to reach a sensitivity of 0.1 (see docs/handoff-opus-delta.md).
# n_runs is the total per condition (runs 1-3 already exist); evaluator Sonnet 5.5, Meme-MQM v2, 2 runs.
# Temperature is ignored for Claude (the CLI samples at its default).
film: ivan-vas
source_lang: Russian
target_lang: English
trans_model: claude-opus-5-5
eval_model: claude-sonnet-5-5
temperature: 0.8
eval_runs: 2
eval_prompt: experiments/films/prompts/eval/mqm-memes-v2.txt
variance_delta: 0.1
methods:
- name: zero
  n_runs: 10
- name: list
  n_runs: 10
  prompt: experiments/films/prompts/unit-list.txt
  unit_list: experiments/films/data/ivan-vas/meme-list.json
- name: list-analysis
  n_runs: 10
  prompt: experiments/films/prompts/list-analysis.txt
  unit_list: experiments/films/data/ivan-vas/list-analysis-general-all.json
